# The measure  Fulfilled revenue = CALCULATE(SUM(Orders[o_totalprice]), Orders[o_orderstatus] = "F")
# of a Power BI model, as /importBI converts it to a metric view: the filter is not carried over.
version: 1.1
source: samples.tpch.orders
comment: Imported from the Orders table of a Power BI semantic model
fields:
  - name: o_orderdate
    expr: o_orderdate
measures:
  - name: Fulfilled revenue
    expr: SUM(o_totalprice)
