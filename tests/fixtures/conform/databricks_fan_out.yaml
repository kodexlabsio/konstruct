# The orders view of Databricks' YAML reference, joined to the line items. A Databricks join is
# many-to-one from the source, so this says each order has one line item; the code's relationships
# test says each line item has one order.
version: 1.1
source: samples.tpch.orders
joins:
  - name: lineitem
    source: samples.tpch.lineitem
    on: source.o_orderkey = lineitem.l_orderkey
fields:
  - name: Line quantity
    expr: lineitem.l_quantity
measures:
  - name: Order count
    expr: COUNT(*)
