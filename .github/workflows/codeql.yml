name: CodeQL

# CodeQL code scanning of Konstruct's own code: the Python package, the viewer's TypeScript,
# the workflows and action.yml, and the Rust core once its sources are in the repository.
# The results go to the Security tab and, on pull requests, to the pull request. Every push to
# main and the weekly run analyse every language; a pull request analyses the languages whose files
# it changes (.kodex/scripts/ci_changes.py), and all of them when it changes CI.
#
# Advanced setup: code scanning's default setup must stay off for the repository, as GitHub
# rejects uploads from an advanced configuration while it is on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's superseded runs are cancelled, so a push never cancels a scheduled run.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: Languages to analyse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # CodeQL fails a language with no source files, so Rust joins the matrix only once there is some.
      - name: Detect the languages
        id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            areas=$(git diff --name-only --no-renames -z HEAD^1 HEAD |
              GITHUB_OUTPUT='' python3 .kodex/scripts/ci_changes.py -z)
          else
            areas=$(GITHUB_OUTPUT='' python3 .kodex/scripts/ci_changes.py --all)
          fi
          languages=()
          grep -qx 'codeql_actions=true' <<< "$areas" && languages+=('"actions"')
          grep -qx 'codeql_javascript=true' <<< "$areas" && languages+=('"javascript-typescript"')
          grep -qx 'codeql_python=true' <<< "$areas" && languages+=('"python"')
          if grep -qx 'codeql_rust=true' <<< "$areas" && [ -n "$(git ls-files '*.rs')" ]; then
            languages+=('"rust"')
          fi
          echo "languages=[$(IFS=,; echo "${languages[*]}")]" | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: Analyse (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the analysis reads the repository
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every language is analysed from source, without a build. The built viewer and views are
      # generated from viewer/src, which is analysed instead; the fixtures and the example project
      # are inputs that Konstruct reads, not code it runs.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - konstruct/outputs/viewer.html
              - konstruct/outputs/views
              - tests/fixtures
              - examples

      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
